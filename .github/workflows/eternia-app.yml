name: eternia-app Android build

# eternia-app/ 변경이 main 에 push 될 때 자동 빌드 + 언제든 수동 실행(workflow_dispatch).
# public 레포 → GitHub 호스티드 러너 무료.
# 산출: 디버그/서명 릴리즈 APK 아티팩트 + 릴리스(폰 브라우저에서 바로 받도록). (#55)
on:
  push:
    branches: [main]
    paths:
      - "eternia-app/**"
      - ".github/workflows/eternia-app.yml"
  workflow_dispatch: {} # 수동 빌드: Actions 탭 > 이 워크플로 > Run workflow

permissions:
  contents: write # 릴리스 생성·업로드 (#55)

concurrency:
  group: eternia-app-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK (debug + signed release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 릴리즈 서명 시크릿이 있으면 서명 릴리즈도 빌드(없으면 debug 만).
    env:
      HAS_SIGNING: ${{ secrets.ETERNIA_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: eternia-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: eternia-app/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages (android-34)
        run: |
          yes 2>/dev/null | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install deps
        run: npm ci

      - name: Run tests
        run: npm test

      # 이 키가 없으면 앱이 엔딩을 서버로 보내지 못한다(submitAppEndRun 이 첫 줄에서 종료).
      # 예전엔 주입이 없어 조용히 무용지물 APK 가 나갔으므로, 여기서 끊는다. (#55)
      - name: Check VITE_APP_KEY secret
        env:
          VITE_APP_KEY: ${{ secrets.VITE_APP_KEY }}
        run: |
          if [ -z "$VITE_APP_KEY" ]; then
            echo "::error::VITE_APP_KEY 시크릿이 비어 있습니다. 이대로 빌드하면 앱이 엔딩을 서버로 못 보냅니다(#55)."
            exit 1
          fi
          echo "VITE_APP_KEY 주입 확인 (${#VITE_APP_KEY}자)"

      - name: Build web (Vite)
        env:
          VITE_APP_KEY: ${{ secrets.VITE_APP_KEY }}
          # 업데이트 확인의 "현재 버전". 아래 gradle 의 appVersionName 과 같은 값이어야
          # 릴리스 태그(v1.0.N)와 정확히 비교된다.
          VITE_APP_VERSION: 1.0.${{ github.run_number }}
        run: npm run build

      # 주입됐어도 번들에 실제로 박혔는지까지 확인(빌드 설정 변화 대비). 값은 출력하지 않는다.
      - name: Verify key baked into bundle
        env:
          VITE_APP_KEY: ${{ secrets.VITE_APP_KEY }}
        run: |
          if grep -rqF "$VITE_APP_KEY" dist/assets/*.js; then
            echo "번들에 앱 키 포함 확인"
          else
            echo "::error::번들에 VITE_APP_KEY 가 박히지 않았습니다(#55)."
            exit 1
          fi

      - name: Sync Capacitor → android
        run: npx cap sync android

      - name: Assemble debug APK
        # 빌드번호 = github.run_number (실행마다 증가) → versionCode / versionName 에 주입
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon --stacktrace \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName=1.0.${{ github.run_number }}

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: eternia-debug-apk-build${{ github.run_number }}
          path: eternia-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Assemble signed release APK
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          ETERNIA_KEYSTORE_FILE: ${{ runner.temp }}/eternia-release.keystore
          ETERNIA_KEYSTORE_PASSWORD: ${{ secrets.ETERNIA_KEYSTORE_PASSWORD }}
          ETERNIA_KEY_ALIAS: ${{ secrets.ETERNIA_KEY_ALIAS }}
          ETERNIA_KEY_PASSWORD: ${{ secrets.ETERNIA_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ETERNIA_KEYSTORE_BASE64 }}" | base64 -d > "$ETERNIA_KEYSTORE_FILE"
          cd android && ./gradlew assembleRelease --no-daemon --stacktrace \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName=1.0.${{ github.run_number }}
          rm -f "$ETERNIA_KEYSTORE_FILE"

      - name: Upload release APK artifact
        if: ${{ env.HAS_SIGNING == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: eternia-release-apk-build${{ github.run_number }}
          path: eternia-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # 아티팩트는 로그인해야 받을 수 있어 폰에서 불편하다. 릴리스로 올려 브라우저로 바로
      # 내려받게 한다. 앱의 업데이트 확인도 releases/latest 를 기준으로 삼는다. (#55)
      - name: Publish release with APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v1.0.${{ github.run_number }}
        run: |
          FILES="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            FILES="$FILES android/app/build/outputs/apk/release/app-release.apk"
          fi
          # 노트는 파일로 넘긴다(여러 줄을 인라인으로 쓰면 YAML 블록이 끊긴다).
          NOTES="$RUNNER_TEMP/release-notes.md"
          {
            echo "빌드 #${{ github.run_number }} · 커밋 ${{ github.sha }}"
            echo
            echo "설치: 아래 APK 를 폰 브라우저로 내려받아 실행하세요."
            echo "- 서명본(권장): app-release.apk"
            echo "- 디버그본: app-debug.apk"
            echo
            echo "처음 설치할 때 '알 수 없는 앱 설치 허용' 을 한 번 켜야 합니다."
            echo "서명본과 디버그본은 서명이 달라 서로 덮어쓸 수 없습니다. 갈아탈 땐 기존 앱을 지우고 설치하세요."
          } > "$NOTES"
          # shellcheck disable=SC2086
          gh release create "$TAG" $FILES \
            --title "에테르니아의 추락 $TAG" \
            --latest \
            --notes-file "$NOTES"
