name: webapp tests

# webapp/ 변경이 main 에 push 될 때 테스트 실행 + 언제든 수동 실행(workflow_dispatch).
# public 레포 → GitHub 호스티드 러너 무료.
on:
  push:
    branches: [main]
    paths:
      - "webapp/**"
      - ".github/workflows/webapp-test.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: webapp-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: vitest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: webapp
    # 서사 검증(lib/web-adventure/__tests__)은 mongo 에서 씬을 읽는다. MONGO_URI 가 없으면
    # 그 테스트들이 조용히 빠져나가 **아무것도 검증하지 않은 채 초록**이 된다(#91 에서 발견).
    # 빈 mongo 를 띄우고 seeds-replay 로 콘텐츠를 세운 뒤 검증한다 — 재해 복구 경로를
    # 매번 실제로 밟아 보는 효과도 있다.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: webapp/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Seed content (재해 복구 경로 그대로)
        run: ./scripts/seeds-replay.sh
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/webadventure-ci

      - name: Run tests
        run: pnpm test
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/webadventure-ci
