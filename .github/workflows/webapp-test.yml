name: webapp tests

# webapp/ 변경이 main 에 push 될 때 테스트 실행 + 언제든 수동 실행(workflow_dispatch).
# public 레포 → GitHub 호스티드 러너 무료.
on:
  push:
    branches: [main]
    paths:
      - "webapp/**"
      - ".github/workflows/webapp-test.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: webapp-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: vitest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: webapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: webapp/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test
