name: webapp tests

# webapp/ 변경을 **PR 시점에** 검증하고, main 에 들어간 뒤 한 번 더 확인한다.
# public 레포 → GitHub 호스티드 러너 무료.
#
# pull_request 가 핵심이다 (#146). 예전엔 push:main 뿐이라 **머지한 뒤에야** 결과를 알았다 —
# 배포 전 확인이 목적인데 순서가 거꾸로였고, 확인하려면 매번 수동 dispatch 해야 했다.
on:
  pull_request:
    branches: [main]
    paths:
      - "webapp/**"
      - ".github/workflows/webapp-test.yml"
  push:
    branches: [main]
    paths:
      - "webapp/**"
      - ".github/workflows/webapp-test.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: webapp-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: vitest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: webapp
    # 서사 검증(lib/web-adventure/__tests__)은 mongo 에서 씬을 읽는다. MONGO_URI 가 없으면
    # 그 테스트들이 조용히 빠져나가 **아무것도 검증하지 않은 채 초록**이 된다(#91 에서 발견).
    # 빈 mongo 를 띄우고 seeds-replay 로 콘텐츠를 세운 뒤 검증한다 — 재해 복구 경로를
    # 매번 실제로 밟아 보는 효과도 있다.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: webapp/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Seed content (재해 복구 경로 그대로)
        run: ./scripts/seeds-replay.sh
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/webadventure-ci

      # 타입·린트는 초 단위라 테스트 앞에 둔다 — 빨리 실패해야 빨리 안다.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/webadventure-ci

  # `tsc --noEmit` 이 통과해도 프로덕션 빌드는 깨질 수 있다 — Next 는 라우트 파일의 export 모양을
  # 빌드 때만 검사해서, 라우트가 상수를 export 하면 여기서만 잡힌다(실제로 두 번 겪음).
  # 배포가 하는 일과 같으므로 배포 전 확인의 마지막 조각이다.
  build:
    name: next build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: webapp
    # 빌드도 mongo 가 필요하다. `/post/view/[[...id]]` 의 generateStaticParams 가 포스트 목록을
    # 읽어 prerender 하므로, DB 가 없으면 "Failed to collect page data" 로 죽는다.
    # 빌드 타임 I/O 는 실수가 아니라 의도된 정적 생성이다.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: webapp/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Seed content (prerender 가 읽을 포스트)
        run: ./scripts/seeds-replay.sh
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/webadventure-ci

      # MINIO_* 는 자리만 채운다 — 이미지는 런타임에 프록시로 내보내므로 빌드는 닿지 않는다.
      - name: Build
        run: pnpm build
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/webadventure-ci
          MINIO_ENDPOINT: 127.0.0.1
          MINIO_ACCESSKEY: ci
          MINIO_SECRETKEY: ci-secret
          MINIO_BUCKET: ci

  # 실 브라우저 검사 (#425, #432). 여태 사람이 손으로 돌려야만 결과를 알았다 —
  # 손패 제스처·지도 배치처럼 **jsdom 이 거짓말하는 것**은 여기서만 잡힌다.
  #
  # `next dev` 로는 못 돈다: 사이트 CSP 가 unsafe-eval 을 막는데 HMR 이 eval 을 써서
  # 하이드레이션이 죽고 버튼이 아무 반응도 안 한다. 그래서 build → start → test 다.
  e2e:
    name: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: webapp
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: webapp/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # 씬을 mongo 에서 읽는 화면들이 있다. 빌드 잡과 같은 재해 복구 경로를 그대로 밟는다.
      - name: Seed content
        run: ./scripts/seeds-replay.sh
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/webadventure-ci

      - name: Install chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/webadventure-ci
          MINIO_ENDPOINT: 127.0.0.1
          MINIO_ACCESSKEY: ci
          MINIO_SECRETKEY: ci-secret
          MINIO_BUCKET: ci

      # 서버를 띄우고 응답할 때까지 기다린다. 매매 스케줄러는 반드시 끈다 —
      # CI 가 실주문을 낼 이유가 없다.
      - name: Start server
        run: |
          pnpm start &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3010/api/health >/dev/null && exit 0
            sleep 2
          done
          echo "::error::서버가 120초 안에 안 떴다"; exit 1
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/webadventure-ci
          MINIO_ENDPOINT: 127.0.0.1
          MINIO_ACCESSKEY: ci
          MINIO_SECRETKEY: ci-secret
          MINIO_BUCKET: ci
          TRADING_SCHEDULER_ENABLED: "false"

      # 기존 9개 스펙은 로컬 전제로 쓰였다(#425 README). CI 에서 처음 도는 것이라
      # 흔들릴 수 있어, 우선 덱빌딩 스펙만 문지기로 세운다. 나머지는 안정화하며 넓힌다.
      - name: e2e (eternia-refine)
        run: pnpm exec playwright test e2e/eternia-refine.spec.ts
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3010

      - name: 실패하면 자취를 남긴다
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            webapp/test-results/
            webapp/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
