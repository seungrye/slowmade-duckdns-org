<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>에테르니아의 추락</title>
<link rel="stylesheet" href="/src/style.css">
</head>
<body class="app">
  <!-- 앱: 게임 화면만 풀스크린(데모용 설명·기기 프레임·푸터는 제거) -->
  <div class="screen" id="screen">
    <div class="status">
      <button class="gear" id="gear" aria-label="설정">⚙</button>
      <div class="strow">
        <div class="portrait"></div>
        <div class="idcol">
          <span class="nameplate">린 · 수사관</span>
          <div class="meters">
            <div class="piprow" id="hpPips"></div>
            <div class="stigrow"><span class="stiglab mono">침식</span><span class="stigbar"><i id="stigBar"></i></span><span class="stigval mono" id="stigVal">0</span></div>
          </div>
        </div>
        <div class="statgrid" id="statgrid"></div>
      </div>
      <div class="goldrule"></div>
    </div>

    <div class="stage" id="stage">
      <div class="log" id="log" tabindex="0"></div>
      <div class="impact-ov" id="impactOv"></div>
    </div>

    <div class="cont hidden" id="cont">▾ 탭하여 계속</div>
    <button class="newpill" id="newpill">새 내용 ▾</button>
    <div class="toast" id="toast"></div>

    <div class="bottombar" id="bottombar">
      <button class="bbtn" type="button" data-bb="codex" title="도감(코덱스)">📖</button>
      <button class="bbtn wip" type="button" data-bb="wip" title="증거 (작업중)">🔎</button>
      <button class="bbtn" type="button" data-bb="rank" title="업적·랭크">🏅</button>
      <span class="sp"></span>
      <button class="bbtn" type="button" data-bb="inv" title="소지품">🎒</button>
    </div>

    <!-- ⚙ 설정 시트 -->
    <div class="sheet-scrim" id="scrim"></div>
    <div class="settings" id="settings">
      <div class="grip"></div>
      <button class="setrow" type="button" id="restart">↺ 처음부터</button>
      <button class="setrow" type="button" id="autoBtn">▷ 자동</button>
      <button class="setrow" type="button" id="fastBtn">» 빠르게</button>
    </div>
  </div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
