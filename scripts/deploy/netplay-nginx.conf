# /netplay/ — 고전 게임 netplay 시그널링 프록시 (#186).
#
# `/etc/nginx/sites-enabled/handmade.r-e.kr` 의 server 블록 안에, `location / {` **앞에**
# 넣는다(접두사 매칭이라 순서 자체는 상관없지만, 함께 읽히도록 API 블록 옆에 둔다).
# 이 파일은 추적본이다 — 실제 반영은 손으로 붙여 넣고 `nginx -t` 후 reload.
#
# 왜 프록시하나: 브라우저가 **같은 오리진**(`handmade.r-e.kr/netplay/`)으로 붙게 하려는 것이다.
#   - CSP `connect-src 'self'` 를 넓히지 않아도 된다(외부 호스트를 여는 것보다 안전하다).
#   - 세션 쿠키가 그대로 실려 와, 아래 auth_request 로 소유자만 통과시킬 수 있다.
#   - 시그널링 서버는 127.0.0.1:3100 에만 떠 있어 밖에서 직접 닿을 수 없다.
#
# WebRTC 자체는 이 경로를 쓰지 않는다 — 두 브라우저가 직접 UDP 로 붙는다(홀펀칭).
# 그래서 공유기에 포트를 새로 열 필요가 없다. 홀펀칭이 실패할 때만 TURN 이 필요하다.

# auth_request 대상 — 상태 코드만 쓰인다(본문 없음).
location = /internal/owner-check {
	internal;
	proxy_pass http://webapp/api/internal/owner-check;
	proxy_pass_request_body off;
	proxy_set_header Content-Length "";
	proxy_set_header Host $host;
	# 쿠키가 있어야 세션을 볼 수 있다.
	proxy_set_header Cookie $http_cookie;
}

location /netplay/ {
	# **소유자만.** 이게 없으면 누구나 방에 끼어들 수 있고 `/list` 로 방 목록도 새어 나간다.
	# socket.io 핸드셰이크도 일반 HTTP 요청이라 여기 걸린다.
	auth_request /internal/owner-check;

	# 뒤의 서버는 `/netplay/` 접두사를 모른다 — 떼고 넘긴다.
	rewrite ^/netplay/(.*)$ /$1 break;
	proxy_pass http://127.0.0.1:3100;

	# WebSocket 업그레이드 — 이게 없으면 socket.io 가 폴링으로만 돌거나 끊긴다.
	proxy_http_version 1.1;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection "upgrade";
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;

	# 대전 중에는 오래 붙어 있다 — 기본 60초로는 끊긴다.
	proxy_read_timeout 1h;
	proxy_send_timeout 1h;

	add_header X-Content-Type-Options "nosniff" always;
}
