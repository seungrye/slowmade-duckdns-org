# ── MinIO 익명 접근 판별 (#165) ───────────────────────────────────────────────
# 처음엔 경로만 보고 404 를 냈다가 **앱까지 막았다** — S3 클라이언트는 버킷 루트로
# `?location=` 을 먼저 부르는데 그것까지 차단됐다.
#
# 그래서 "익명일 때만" 막는다. 정상 요청(앱·mc)은 AWS 서명 헤더(Authorization)를 달고 오고,
# 브라우저로 주소만 치는 익명 접근은 그 헤더가 없다. 서명은 MinIO 가 검증하므로 헤더를
# 위조해도 통과하지 못한다.
map $request_uri $minio_sensitive {
	default 0;
	# 버킷 루트 = 목록 조회. 키가 랜덤이어도 목록이 열리면 무의미해진다.
	"~^(/s3)?/[^/?]+/?(\?|$)" 1;
	# 앱이 인증으로 내려주는 것들.
	"~^(/s3)?/[^/]+/(retro-roms|retro-states|retro-patches|retro-covers|attachments)/" 1;
}
map "$http_authorization:$minio_sensitive" $minio_deny_anon {
	default 0;
	"~^:1$" 1;   # 서명 없음 + 민감 경로 → 차단
}

