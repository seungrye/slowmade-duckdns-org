# ── 레이트리밋 zone (L7 남용 방어) ────────────────────────────────────────────
# 가정용 회선 + 단일 호스트라 **볼류메트릭 DDoS 는 여기서 못 막는다** — 회선이 먼저 죽는다.
# 여기서 막는 건 L7 남용: API 연타, 인증 콜백 대입, 스캐너, 느린 연결.
#
# zone 은 정의만으로는 아무 효과가 없다. 반드시 각 location 의 `limit_req` 가 참조해야 한다
# (전에 zone=llm 을 정의만 해두고 어디서도 안 써서 리밋이 전혀 걸리지 않았다).
#
# 429 로 응답하고, 초과 로그(`limiting requests …`)는 error.log 로 남아
# fail2ban 의 nginx-limit-req jail 이 반복 위반 IP 를 차단한다 — 둘이 물려 돈다.

# ── 내부망은 리밋 대상에서 뺀다 ───────────────────────────────────────────────
# 집 안 기기가 도메인으로 접속하면 공유기 NAT loopback 을 거치면서 소스 주소가 전부
# **게이트웨이(192.168.0.1) 하나로 합쳐진다.** 그 상태로 리밋을 걸면 기기들이 서로의
# 몫을 잡아먹고, 실제로 브라우저가 429 를 맞았다.
#
# 빈 문자열을 키로 주면 nginx 는 그 요청을 zone 에 기록하지 않는다 = 리밋 면제.
# fail2ban 의 ignoreip 와 같은 범위로 맞춰 둔다.
#
# 127.0.0.1 은 **일부러 면제하지 않는다** — 로컬에서 도메인으로 오는 건 검증·모니터링뿐이고,
# 리밋이 살아 있어야 설정이 실제로 동작하는지 확인할 수 있다.
geo $rl_exempt {
	default        0;
	192.168.0.0/24 1;
}
map $rl_exempt $rl_key {
	0 $binary_remote_addr;
	1 "";
}

# 페이지·정적 자산.
# **정상 사용이 초당 190건을 친다** — 태그 목록처럼 링크가 많은 페이지에서 Next.js 가
# `?_rsc=` RSC prefetch 를 한꺼번에 쏟아낸다(실측: 한 세션에 1,239건). 처음 잡았던
# 40r/s·burst 200 은 그걸 못 버티고 실사용자를 튕겼다. burst 가 그 파도를 통째로 흡수한다.
limit_req_zone  $rl_key zone=web:10m    rate=100r/s;

# /api/ — 정상 사용은 초당 몇 건이다. prefetch 는 여기로 오지 않는다.
limit_req_zone  $rl_key zone=api:10m    rate=20r/s;

# OAuth 시작·콜백만. /api/auth/session·csrf 는 화면 전환마다 불리는 정상 트래픽이라
# 여기 넣지 않는다(넣으면 로그인한 사용자가 429 를 맞는다).
limit_req_zone  $rl_key zone=auth:10m   rate=30r/m;

# 대용량 업로드(첨부·APK·롬). 건당 수십 MB 라 빈도 자체가 낮다.
limit_req_zone  $rl_key zone=upload:10m rate=60r/m;

# 동시 연결 — Slowloris 류가 커넥션을 붙잡고 늘어지는 걸 IP 단위로 제한.
limit_conn_zone $rl_key zone=conn:10m;

# 기본 503 대신 429(Too Many Requests) — 클라이언트가 백오프할 수 있게.
limit_req_status  429;
limit_conn_status 429;
