# ── 레이트리밋 zone (L7 남용 방어) ────────────────────────────────────────────
# 가정용 회선 + 단일 호스트라 **볼류메트릭 DDoS 는 여기서 못 막는다** — 회선이 먼저 죽는다.
# 여기서 막는 건 L7 남용: API 연타, 인증 콜백 대입, 스캐너, 느린 연결.
#
# zone 은 정의만으로는 아무 효과가 없다. 반드시 각 location 의 `limit_req` 가 참조해야 한다
# (전에 zone=llm 을 정의만 해두고 어디서도 안 써서 리밋이 전혀 걸리지 않았다).
#
# 429 로 응답하고, 초과 로그(`limiting requests …`)는 error.log 로 남아
# fail2ban 의 nginx-limit-req jail 이 반복 위반 IP 를 차단한다 — 둘이 물려 돈다.

# 페이지·정적 자산. Next.js 한 페이지가 _next/static 을 수십 개 부르므로 burst 를 크게 준다.
limit_req_zone  $binary_remote_addr zone=web:10m    rate=40r/s;

# /api/ — 정상 사용은 초당 몇 건이다.
limit_req_zone  $binary_remote_addr zone=api:10m    rate=20r/s;

# OAuth 시작·콜백만. /api/auth/session·csrf 는 화면 전환마다 불리는 정상 트래픽이라
# 여기 넣지 않는다(넣으면 로그인한 사용자가 429 를 맞는다).
limit_req_zone  $binary_remote_addr zone=auth:10m   rate=30r/m;

# 대용량 업로드(첨부·APK·롬). 건당 수십 MB 라 빈도 자체가 낮다.
limit_req_zone  $binary_remote_addr zone=upload:10m rate=60r/m;

# 동시 연결 — Slowloris 류가 커넥션을 붙잡고 늘어지는 걸 IP 단위로 제한.
limit_conn_zone $binary_remote_addr zone=conn:10m;

# 기본 503 대신 429(Too Many Requests) — 클라이언트가 백오프할 수 있게.
limit_req_status  429;
limit_conn_status 429;
