<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>레트로 플레이어</title>
<!--
  EmulatorJS 를 띄우는 격리된 진입점 (#109, 패치 #112).

  왜 별도 HTML 인가: EmulatorJS 는 `EJS_*` 전역을 읽고 스스로 script·CSS·DOM 을 주입하는 구식
  로더다. Next.js 클라이언트 라우팅에서 직접 마운트하면 라우트를 오갈 때 전역과 DOM 이 남아 두 번째
  실행이 깨진다. iframe 안에 가둬 두면 화면을 떠날 때 통째로 정리된다.

  이 파일은 저장소에 커밋되지만 `data/`(에뮬레이터 본체)는 gitignore 다 —
  `scripts/games/fetch-emulatorjs.sh` 로 내려받는다.
-->
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #game { width: 100%; height: 100%; }
  .notice {
    display: flex; align-items: center; justify-content: center;
    height: 100%; padding: 1.5rem; box-sizing: border-box;
    font: 14px/1.7 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: #d4d4d8; text-align: center;
  }
  .notice code { color: #fca5a5; word-break: break-all; }
  /* 오른쪽 클릭 메뉴를 쓰지 않는다 (#114). EmulatorJS 는 인라인 style 로 여는데,
     스타일시트의 !important 가 인라인(비-important)을 이긴다.
     안에 있던 quickSave·quickLoad 도 함께 사라져, 서버 저장과 경쟁하는 로컬 저장 경로가 없어진다. */
  .ejs_context_menu { display: none !important; }
</style>
</head>
<body>
<div id="game"></div>
<script type="module" src="./player.js"></script>
</body>
</html>
