<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>레트로 플레이어</title>
<!--
  EmulatorJS 를 띄우는 격리된 진입점 (#109).

  왜 별도 HTML 인가: EmulatorJS 는 `EJS_*` 전역을 읽고 스스로 script·CSS·DOM 을 주입하는 구식
  로더다. Next.js 클라이언트 라우팅에서 직접 마운트하면 라우트를 오갈 때 전역과 DOM 이 남아 두 번째
  실행이 깨진다. iframe 안에 가둬 두면 화면을 떠날 때 통째로 정리된다.

  이 파일은 저장소에 커밋되지만 `data/`(에뮬레이터 본체)는 gitignore 다 —
  `scripts/games/fetch-emulatorjs.sh` 로 내려받는다.
-->
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #game { width: 100%; height: 100%; }
  .notice {
    display: flex; align-items: center; justify-content: center;
    height: 100%; padding: 1.5rem; box-sizing: border-box;
    font: 14px/1.7 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: #d4d4d8; text-align: center;
  }
  .notice code { color: #fca5a5; word-break: break-all; }
</style>
</head>
<body>
<div id="game"></div>
<script>
(function () {
  var DATA_PATH = '/games/retro/data/';
  // src/lib/retro/platforms.ts 의 core 값과 같아야 한다. 양쪽을 함께 고칠 것.
  var CORES = ['fceumm', 'snes9x', 'gambatte', 'mgba', 'genesis_plus_gx'];

  function notice(html) {
    document.getElementById('game').outerHTML = '<div class="notice"><div>' + html + '</div></div>';
  }

  // EmulatorJS 는 시작할 때 cdn.emulatorjs.org 로 버전을 확인한다. 자체 호스팅이 목적이라
  // CSP 가 그 요청을 막고, 막힌 fetch 가 처리되지 않은 거부로 콘솔에 남는다. 기능과 무관하므로
  // **그 한 건만** 삼킨다. 끄는 설정은 EmulatorJS 에 없다(stable 은 항상 확인한다).
  window.addEventListener('unhandledrejection', function (ev) {
    if (String(ev.reason && ev.reason.message) === 'Failed to fetch') ev.preventDefault();
  });

  var q = new URLSearchParams(location.search);
  var core = q.get('core') || '';
  var rom = q.get('rom') || '';

  // 이 문서는 CSP 에서 'unsafe-eval' 이 열려 있다(코어 7z 해제에 필요 — middleware.ts 참고).
  // name 은 EmulatorJS UI 로 흘러 들어가는 **유일한 반사 입력**이므로, 그쪽이 어떻게 그리든
  // HTML 로 해석될 여지를 여기서 없앤다. 주소창으로 직접 열 수 있는 페이지라 더 그렇다.
  var name = (q.get('name') || '').replace(/[<>"'&]/g, '').slice(0, 80);

  if (CORES.indexOf(core) < 0) return notice('지원하지 않는 기종입니다.');
  if (!rom) return notice('실행할 롬이 지정되지 않았습니다.');

  // 같은 출처만 허용 — 부모가 이미 거르지만 여기도 막는다. 이 페이지는 주소창으로 직접 열 수
  // 있으므로, 이 검사가 없으면 누구나 남의 서버 파일을 우리 플레이어로 트는 통로가 된다.
  var sameOrigin = rom.indexOf('blob:') === 0 || (rom.charAt(0) === '/' && rom.charAt(1) !== '/');
  if (!sameOrigin) return notice('외부 출처의 롬은 실행하지 않습니다.');

  window.EJS_player = '#game';
  window.EJS_core = core;
  window.EJS_gameUrl = rom;
  window.EJS_gameName = name;
  window.EJS_pathtodata = DATA_PATH;
  window.EJS_startOnLoaded = true;
  // 사이트 강조색(blue-500)과 맞춘다.
  window.EJS_color = '#3b82f6';
  // EJS_threads 는 켜지 않는다 — SharedArrayBuffer 가 필요해지고 그러면 COOP/COEP 헤더를
  // 걸어야 한다. 이 다섯 기종은 단일 스레드로 충분하다.

  var s = document.createElement('script');
  s.src = DATA_PATH + 'loader.js';
  s.onerror = function () {
    notice(
      '에뮬레이터 파일이 서버에 없습니다.<br><br>' +
      '<code>bash scripts/games/fetch-emulatorjs.sh</code><br><br>' +
      '를 실행해 <code>public/games/retro/data/</code> 를 채워 주세요.'
    );
  };
  document.body.appendChild(s);
})();
</script>
</body>
</html>
